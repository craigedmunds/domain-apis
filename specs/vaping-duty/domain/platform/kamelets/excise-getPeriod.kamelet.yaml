# Generated from: mocks/excise-api.yaml
# Operation: getPeriod
# GET /excise/vpd/periods/{periodKey}
# Response: application/xml -> transformed to JSON
#
# POC uses HTTP - production deployment should use HTTPS or service mesh mTLS
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: excise-getPeriod
  labels:
    camel.apache.org/kamelet.type: action
spec:
  definition:
    title: Excise - Get Period
    description: Retrieve VPD period by period key (XML response transformed to JSON)
    required:
      - periodKey
    properties:
      periodKey:
        title: Period Key
        description: The accounting period key
        type: string
        pattern: '^[0-9]{2}[A-Z]{1}[0-9]$'
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelHttp*"
        - setHeader:
            name: CamelHttpMethod
            constant: "GET"
        - setHeader:
            name: Accept
            constant: "application/xml"
        - setHeader:
            name: X-Correlation-Id
            simple: "${exchangeProperty.correlationId}"
        - toD:
            uri: "{{env:EXCISE_URL}}/excise/vpd/periods/{{periodKey}}?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - setProperty:
            name: excisePeriodResponseCode
            simple: "${header.CamelHttpResponseCode}"
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} >= 400"
                steps:
                  - setProperty:
                      name: excisePeriodError
                      simple: "${body}"
                  - log:
                      message: "Excise period error: ${header.CamelHttpResponseCode} - ${body}"
                      loggingLevel: ERROR
            otherwise:
              steps:
                # Transform XML to JSON
                - setProperty:
                    name: excisePeriodXml
                    simple: "${body}"
                - setBody:
                    groovy: |
                      import groovy.xml.XmlSlurper
                      import groovy.json.JsonOutput

                      def xmlText = exchange.getProperty('excisePeriodXml', String)
                      def xml = new XmlSlurper().parseText(xmlText)

                      def period = [
                        periodKey: xml.periodKey.text(),
                        startDate: xml.startDate.text(),
                        endDate: xml.endDate.text(),
                        state: xml.state.text(),
                        dutyRates: [
                          standardRate: xml.dutyRates.standardRate.text(),
                          reducedRate: xml.dutyRates.reducedRate.text()
                        ]
                      ]

                      return JsonOutput.toJson(period)
                - setProperty:
                    name: excisePeriodResponse
                    simple: "${body}"
