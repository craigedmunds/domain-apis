# Generated from: mocks/customer-api.yaml
# Operation: getCustomer
# GET /customers/{customerId}
#
# POC uses HTTP - production deployment should use HTTPS or service mesh mTLS
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: customer-getCustomer
  labels:
    camel.apache.org/kamelet.type: action
spec:
  definition:
    title: Customer - Get Customer
    description: Retrieve customer details by ID
    required:
      - customerId
    properties:
      customerId:
        title: Customer ID
        description: The customer identifier
        type: string
        pattern: '^[A-Za-z0-9-]+$'
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelHttp*"
        - setHeader:
            name: CamelHttpMethod
            constant: "GET"
        - setHeader:
            name: Accept
            constant: "application/json"
        - setHeader:
            name: X-Correlation-Id
            simple: "${exchangeProperty.correlationId}"
        - toD:
            uri: "http://customer-mock:4010/customers/{{customerId}}?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - setProperty:
            name: customerResponseCode
            simple: "${header.CamelHttpResponseCode}"
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} >= 400"
                steps:
                  - setProperty:
                      name: customerError
                      simple: "${body}"
                  - log:
                      message: "Customer API error: ${header.CamelHttpResponseCode} - ${body}"
                      loggingLevel: ERROR
            otherwise:
              steps:
                - setProperty:
                    name: customerResponse
                    simple: "${body}"
