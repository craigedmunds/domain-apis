# VPD Domain API - GET by Acknowledgement Reference
#
# Refactored to use reusable subroutes from common.yaml:
# - prepareGetRequest / prepareXmlGetRequest for HTTP setup
# - parseExciseRegistrationXml / parseExcisePeriodXml for XML transformation
# - assembleGetResponse for combining backend responses
# - applySparseFieldsets for field filtering
# - injectResponseHeaders for response headers
#
# Full orchestration flow:
# 1. tax-platform -> get submission (includes vpdApprovalNumber, periodKey, customerId)
# 2. excise -> get registration (XML) -> transform to JSON
# 3. excise -> get period (XML) -> transform to JSON
# 4. customer -> get trader details
# 5. Combine into enriched response
# 6. Apply sparse fieldsets if requested

- route:
    id: getByAcknowledgement
    from:
      uri: direct:getByAcknowledgement
      steps:
        # Step 1: Call tax-platform to get submission
        - to: direct:prepareGetRequest
        - toD:
            uri: "http://tax-platform-proxy:4010/submissions/vpd/${exchangeProperty.ackRef}?bridgeEndpoint=true&throwExceptionOnFailure=false"

        # Store submission response and extract keys
        - setProperty:
            name: taxPlatformResponse
            simple: "${body}"
        - setProperty:
            name: customerId
            jsonpath:
              expression: "$.customerId"
              suppressExceptions: true
        - setProperty:
            name: vpdApprovalNumber
            jsonpath:
              expression: "$.vpdApprovalNumber"
              suppressExceptions: true
        - setProperty:
            name: periodKey
            jsonpath:
              expression: "$.periodKey"
              suppressExceptions: true

        - log:
            message: "Tax-platform response received - customerId: ${exchangeProperty.customerId}, approval: ${exchangeProperty.vpdApprovalNumber}, period: ${exchangeProperty.periodKey}"
            loggingLevel: INFO

        # Step 2: Call excise to get registration (XML response)
        - to: direct:prepareXmlGetRequest
        - toD:
            uri: "http://excise-proxy:4010/excise/vpd/registrations/${exchangeProperty.vpdApprovalNumber}?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - to: direct:parseExciseRegistrationXml

        - log:
            message: "Excise registration received (XML->JSON)"
            loggingLevel: INFO

        # Step 3: Call excise to get period (XML response)
        - to: direct:prepareXmlGetRequest
        - toD:
            uri: "http://excise-proxy:4010/excise/vpd/periods/${exchangeProperty.periodKey}?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - to: direct:parseExcisePeriodXml

        - log:
            message: "Excise period received (XML->JSON)"
            loggingLevel: INFO

        # Step 4: Call customer service to get trader details
        - to: direct:prepareGetRequest
        - toD:
            uri: "http://customer-proxy:4010/customers/${exchangeProperty.customerId}?bridgeEndpoint=true&throwExceptionOnFailure=false"

        # Store customer response
        - setProperty:
            name: customerResponse
            simple: "${body}"

        - log:
            message: "Customer response received"
            loggingLevel: INFO

        # Step 5: Combine all responses
        - to: direct:assembleGetResponse

        # Step 6: Apply sparse fieldsets if requested
        - to: direct:applySparseFieldsets

        # Set response headers
        - to: direct:injectResponseHeaders
