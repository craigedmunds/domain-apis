# VPD Domain API - POST Submission Return
#
# Uses Kamelets for backend calls:
# - excise-validateAndCalculate: Validate and calculate duty (XML->JSON)
# - tax-platform-storeSubmission: Store submission
# - customer-getCustomer: Get customer details
#
# Full orchestration flow:
# 1. excise -> validate-and-calculate (XML->JSON) - returns customerId, calculations
# 2. If valid == false: return 422
# 3. tax-platform -> store submission
# 4. customer -> get trader details (for response enrichment)
# 5. Return acknowledgement with enriched data
#
# Note: Groovy logic is inline due to Camel JBang classloader limitations.
# See lib/*.groovy for testable versions of this logic.

- route:
    id: postSubmissionReturn
    from:
      uri: direct:postSubmissionReturn
      steps:
        # Extract standard headers
        - to: direct:extractStandardHeaders

        # Store request body for reuse (see lib/BodyUtils.groovy)
        - setProperty:
            name: requestBody
            groovy: |
              if (body == null) return null
              if (body instanceof byte[]) return new String(body, 'UTF-8')
              if (body instanceof InputStream) return new String(body.bytes, 'UTF-8')
              return body.toString()

        # Extract vpdApprovalNumber and periodKey from request body
        - setProperty:
            name: vpdApprovalNumber
            jsonpath:
              expression: "$.vpdApprovalNumber"
              suppressExceptions: true
        - setProperty:
            name: periodKey
            jsonpath:
              expression: "$.periodKey"
              suppressExceptions: true

        - log:
            message: "POST submission - approval: ${exchangeProperty.vpdApprovalNumber}, period: ${exchangeProperty.periodKey}"
            loggingLevel: INFO

        # Step 1: Validate and calculate via excise (XML->JSON)
        - kamelet:
            name: excise-validateAndCalculate
            parameters:
              requestBody: "${exchangeProperty.requestBody}"

        # Check for excise errors
        - choice:
            when:
              - simple: "${exchangeProperty.exciseResponseCode} != 200"
                steps:
                  - log:
                      message: "Excise returned error: ${exchangeProperty.exciseResponseCode}"
                      loggingLevel: WARN
                  - setHeader:
                      name: CamelHttpResponseCode
                      simple: "${exchangeProperty.exciseResponseCode}"
                  - setBody:
                      simple: '{"code": "EXCISE_ERROR", "message": "Excise validation service returned an error"}'
                  - to: direct:injectResponseHeaders
                  - stop: {}

        - log:
            message: "Excise validation result - valid: ${exchangeProperty.validationValid}, customerId: ${exchangeProperty.customerId}"
            loggingLevel: INFO

        # Step 2: Check validation result - short circuit if invalid
        # (see lib/ValidationErrorBuilder.groovy)
        - choice:
            when:
              - simple: "${exchangeProperty.validationValid} == false"
                steps:
                  - setHeader:
                      name: CamelHttpResponseCode
                      constant: 422
                  - setBody:
                      groovy: |
                        import groovy.json.JsonSlurper
                        import groovy.json.JsonOutput

                        def slurper = new JsonSlurper()
                        def validation = slurper.parseText(exchange.getProperty('exciseValidationResponse', String))

                        def error = [
                          code: 'VALIDATION_FAILED',
                          message: 'Submission failed validation',
                          warnings: validation.warnings ?: []
                        ]

                        return JsonOutput.toJson(error)
                  - to: direct:injectResponseHeaders
                  - stop: {}

        # Step 3: Store submission in tax-platform (validation passed)
        # (see lib/StoreRequestBuilder.groovy)
        - setProperty:
            name: storeRequestBody
            groovy: |
              import groovy.json.JsonSlurper
              import groovy.json.JsonOutput

              def slurper = new JsonSlurper()
              def originalRequest = slurper.parseText(exchange.getProperty('requestBody', String))
              def validation = slurper.parseText(exchange.getProperty('exciseValidationResponse', String))

              def storeRequest = [
                vpdApprovalNumber: originalRequest.vpdApprovalNumber,
                periodKey: originalRequest.periodKey,
                customerId: validation.customerId,
                submission: originalRequest,
                calculations: validation.calculations,
                warnings: validation.warnings ?: []
              ]

              return JsonOutput.toJson(storeRequest)

        - kamelet:
            name: tax-platform-storeSubmission
            parameters:
              requestBody: "${exchangeProperty.storeRequestBody}"

        - log:
            message: "Submission stored in tax-platform"
            loggingLevel: INFO

        # Step 4: Get customer details
        # Note: Uses POST-specific Kamelet to avoid Camel JBang routing bug
        # where shared Kamelets cause route continuation in wrong route
        - kamelet:
            name: customer-getCustomer-post
            parameters:
              customerId: "${exchangeProperty.customerId}"

        - log:
            message: "Customer details retrieved"
            loggingLevel: INFO

        # Step 5: Build enriched acknowledgement response
        # (see lib/SubmissionReturnResponseBuilder.groovy)
        - setBody:
            groovy: |
              import groovy.json.JsonSlurper
              import groovy.json.JsonOutput

              def parseProperty(slurper, exchange, propertyName) {
                def value = exchange.getProperty(propertyName)
                if (!value) return null
                if (value instanceof byte[]) value = new String(value, 'UTF-8')
                try { return slurper.parseText(value.toString()) } catch (e) { return null }
              }

              def slurper = new JsonSlurper()
              def storeResult = parseProperty(slurper, exchange, 'taxPlatformStoreResponse') ?: [:]
              def customer = parseProperty(slurper, exchange, 'customerResponse') ?: [:]
              def validation = parseProperty(slurper, exchange, 'exciseValidationResponse') ?: [:]

              def response = [
                acknowledgementReference: storeResult.acknowledgementReference,
                vpdApprovalNumber: exchange.getProperty('vpdApprovalNumber'),
                periodKey: exchange.getProperty('periodKey'),
                status: 'RECEIVED',
                storedAt: storeResult.storedAt,
                trader: [
                  name: customer.name,
                  type: customer.type
                ],
                calculations: validation.calculations,
                warnings: validation.warnings ?: []
              ]

              return JsonOutput.toJson(response)

        - setHeader:
            name: CamelHttpResponseCode
            constant: 201
        - to: direct:injectResponseHeaders
