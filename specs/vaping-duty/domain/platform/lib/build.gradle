plugins {
    id 'groovy'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.groovy:groovy-all:4.0.29'
    // Note: No Camel dependency - use duck typing for exchange to avoid version coupling

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        groovy {
            srcDirs = ['.']
            include '**/*.groovy'
            exclude 'build/**', '**/test/**'
        }
    }
    test {
        groovy {
            srcDirs = ['test']
        }
    }
}

jar {
    archiveBaseName = 'domain-api-lib'
    archiveVersion = '1.0.0'
}

test {
    useJUnitPlatform()
}
