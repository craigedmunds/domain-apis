# VPD Domain API - Quarkus + Camel Java DSL
#
# Mirrors the configuration of the YAML DSL implementation (platform/)
# but runs on port 8082 to allow both to coexist in docker-compose.

# HTTP port - 8082 (YAML DSL uses 8080)
quarkus.http.port=8082

# Camel context name
camel.context.name=vpd-domain-api-java

# Backend service URLs (same as YAML DSL - both use same docker network)
vpd.backend.excise.url=http://excise-proxy:4010
vpd.backend.customer.url=http://customer-proxy:4010
vpd.backend.tax-platform.url=http://tax-platform-proxy:4010

# Logging
quarkus.log.level=INFO
quarkus.log.category."uk.gov.hmrc.hip.vpd".level=DEBUG
quarkus.log.category."org.apache.camel".level=INFO

# OpenTelemetry
# quarkus.otel.traces.exporter is build-time fixed; set to 'none' here so the
# image works without an OTel collector. To enable tracing, rebuild the image
# with -Dquarkus.otel.traces.exporter=otlp (or change this property and rebuild).
quarkus.otel.traces.exporter=none
quarkus.otel.exporter.otlp.traces.endpoint=http://otel-collector:4317
quarkus.otel.service.name=vpd-domain-api-java

# Health check
quarkus.smallrye-health.root-path=/health

# Disable banner in logs
quarkus.banner.enabled=false
