# Customs Authorisation Kamelet (Scatter-Gather leg)
# One of three parallel registry lookups in the Trader Overview Scatter-Gather.
# Stores result as exchangeProperty.customsResult for aggregation.
apiVersion: camel.apache.org/v1
kind: Kamelet
metadata:
  name: customs-getAuthorisation
  labels:
    camel.apache.org/kamelet.type: action
spec:
  definition:
    title: Customs — Get Trader Authorisation
    description: Fetches AEO (Authorised Economic Operator) status and authorisations
    required:
      - eori
    properties:
      eori:
        title: EORI Number
        type: string
  template:
    from:
      uri: kamelet:source
      steps:
        - removeHeaders:
            pattern: "CamelHttp*"
        - setHeader:
            name: CamelHttpMethod
            constant: "GET"
        - setHeader:
            name: Accept
            constant: "application/json"
        - setHeader:
            name: X-Correlation-Id
            simple: "${exchangeProperty.correlationId}"
        - to:
            uri: "http://customs-mock:8080/customs/traders/{{eori}}/authorisations?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - setProperty:
            name: customsResponseCode
            simple: "${header.CamelHttpResponseCode}"
        - choice:
            when:
              - simple: "${header.CamelHttpResponseCode} == 200"
                steps:
                  - setProperty:
                      name: customsResult
                      groovy: |
                        import groovy.json.JsonSlurper
                        def text = body instanceof byte[] ? new String(body, 'UTF-8') : body.toString()
                        return new JsonSlurper().parseText(text)
              - simple: "${header.CamelHttpResponseCode} >= 500"
                steps:
                  - throwException:
                      exceptionType: java.lang.RuntimeException
                      message: "Customs authorisation registry unavailable: HTTP ${exchangeProperty.customsResponseCode}"
            otherwise:
              steps:
                - setProperty:
                    name: customsResult
                    groovy: "return [aeoStatus: 'NOT_AUTHORISED', authorisations: []]"
