---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: basic-auth-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: central-secret-store
  target:
    name: basic-auth-credentials
  data:
    - secretKey: users
      remoteRef:
        key: basic-auth-credentials
        property: users
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
spec:
  basicAuth:
    secret: basic-auth-credentials
    removeHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headers
spec:
  headers:
    accessControlAllowOriginList:
      - "https://vpd-docs.lab.ctoaas.co"
      - "https://vpd-docs.lab.local.ctoaas.co"
    accessControlAllowMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    accessControlAllowHeaders:
      - "Content-Type"
      - "Accept"
      - "Authorization"
      - "X-Correlation-Id"
      - "X-Idempotency-Key"
    accessControlAllowCredentials: true
    accessControlMaxAge: 3600
    addVaryHeader: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: public-api-chain
spec:
  chain:
    middlewares:
      - name: cors-headers
      - name: basic-auth
