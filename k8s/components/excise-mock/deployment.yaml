apiVersion: apps/v1
kind: Deployment
metadata:
  name: excise-mock
  labels:
    app.kubernetes.io/name: excise-mock
    app.kubernetes.io/component: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: excise-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: excise-mock
        app.kubernetes.io/component: mock
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.3.1
          args:
            - --verbose
            - --enable-stub-cors
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
              readOnly: true
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: mappings
          configMap:
            name: excise-mock-mappings
