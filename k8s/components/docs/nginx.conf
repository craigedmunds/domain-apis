events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name _;

        # Serve docs from repos/domain-apis/docs directory but at root URL
        location / {
            alias /workspace/agents/techcle/repos/domain-apis/docs/;
            index index.html;
            autoindex on;
        }

        # Serve specs from repos/domain-apis/specs directory
        location /specs {
            alias /workspace/agents/techcle/repos/domain-apis/specs;
            autoindex on;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
