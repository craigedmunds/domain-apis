server {
    listen 8080;
    server_name _;
    
    # Serve docs from /docs directory but at root URL
    location / {
        root /web/docs;
        index index.html;
        autoindex on;
    }
    
    # Serve specs from /specs directory
    location /specs {
        alias /web/specs;
        autoindex on;
        add_header Access-Control-Allow-Origin *;
    }
}
