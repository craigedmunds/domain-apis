apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-platform-mock
  labels:
    app.kubernetes.io/name: tax-platform-mock
    app.kubernetes.io/component: mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tax-platform-mock
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tax-platform-mock
        app.kubernetes.io/component: mock
    spec:
      containers:
        - name: prism
          image: stoplight/prism:5.8.2
          args:
            - mock
            - -h
            - 0.0.0.0
            - /specs/tax-platform-api.yaml
          ports:
            - name: http
              containerPort: 4010
          volumeMounts:
            - name: specs
              mountPath: /specs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: specs
          configMap:
            name: tax-platform-mock-specs
