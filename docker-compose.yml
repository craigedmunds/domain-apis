# Domain APIs - Docker Compose
#
# VPD Submission Returns POC stack:
# - Domain API (JBang + Camel YAML DSL): Orchestration service
# - excise mock (WireMock): Returns XML (legacy system simulation)
# - customer mock (Prism): Returns JSON
# - tax-platform mock (Prism): Returns JSON
# - Logging proxies (Envoy): Request logging, tracing, CORS
# - LGTM observability stack: Loki, Grafana, Tempo, Mimir
# - k6 for load testing
#
# Architecture:
#   External ports → Domain API → Envoy proxies → Mocks (internal)
#
# Usage:
#   docker-compose up -d                 # Start all services
#   docker-compose logs -f domain-api    # Follow domain API logs
#   docker-compose run k6 run /tests/smoke-test-mocks.js  # Run tests
#   docker-compose down                  # Stop and remove containers

services:

  # =============================================================================
  # Domain API (Apache Camel JBang + YAML DSL) - Internal
  # =============================================================================

  domain-api-internal:
    image: apache/camel-jbang:4.16.0
    container_name: vpd-domain-api-internal
    command: >
      run /routes/rest-config.yaml
          /routes/get-submission-return-by-ack.yaml
          /routes/get-submission-return-by-approval.yaml
          /routes/post-submission-return.yaml
          /routes/common.yaml
          /kamelets/customer-getCustomer.kamelet.yaml
          /kamelets/tax-platform-getSubmission.kamelet.yaml
          /kamelets/tax-platform-findSubmission.kamelet.yaml
          /kamelets/tax-platform-storeSubmission.kamelet.yaml
          /kamelets/excise-getRegistration.kamelet.yaml
          /kamelets/excise-getPeriod.kamelet.yaml
          /kamelets/excise-validateAndCalculate.kamelet.yaml
      --dep=org.apache.camel:camel-jacksonxml
      --dep=org.apache.camel:camel-groovy
      --dep=org.apache.groovy:groovy-json:4.0.29
      --dep=org.apache.groovy:groovy-xml:4.0.29
    volumes:
      - ./specs/vaping-duty/domain/platform/routes:/routes:ro
      - ./specs/vaping-duty/domain/platform/kamelets:/kamelets:ro
    networks:
      - domain-api-network
    depends_on:
      - excise-proxy
      - customer-proxy
      - tax-platform-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # =============================================================================
  # Domain API - Camel Java DSL (Quarkus) - Internal
  # Equivalent implementation to domain-api-internal, using Java DSL instead
  # of YAML DSL. Runs on port 8082, exposed via Envoy on 8083.
  # =============================================================================

  domain-api-java-internal:
    build:
      context: ./specs/vaping-duty/domain/platform-java
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: ghcr.io/craigedmunds/vpd-domain-api-java:latest
    container_name: vpd-domain-api-java-internal
    ports:
      - "8082:8082"
    networks:
      - domain-api-network
    depends_on:
      - excise-proxy
      - customer-proxy
      - tax-platform-proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  domain-api-java-proxy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: vpd-domain-api-java-proxy
    ports:
      - "8083:8080"
      - "9904:9901"
    volumes:
      - ./config/envoy/envoy-domain-api-java.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      domain-api-java-internal:
        condition: service_healthy
      lgtm:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=domain-api-java-proxy,job=envoy"
    networks:
      - domain-api-network

  # =============================================================================
  # Domain API Proxy (Envoy) - CORS, logging, tracing
  # =============================================================================

  domain-api-proxy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: vpd-domain-api-proxy
    ports:
      - "8081:8080"
      - "9900:9901"
    volumes:
      - ./config/envoy/envoy-domain-api.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      domain-api-internal:
        condition: service_healthy
      lgtm:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=domain-api-proxy,job=envoy"
    networks:
      - domain-api-network

  # =============================================================================
  # Docs / Try It Site
  # =============================================================================

  docs:
    image: halverneus/static-file-server:latest
    container_name: domain-api-docs
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/web
      - ./specs:/web/specs
    environment:
      - FOLDER=/web
      - PORT=8080
      - SHOW_LISTING=true
    networks:
      - domain-api-network

  # =============================================================================
  # VPD Backend Mocks - Internal (accessed via proxies)
  # =============================================================================

  # Excise mock uses WireMock for XML support
  excise-mock-internal:
    image: wiremock/wiremock:3.3.1
    container_name: vpd-excise-mock-internal
    volumes:
      - ./specs/vaping-duty/mocks/wiremock:/home/wiremock
    command: --verbose --enable-stub-cors
    networks:
      - domain-api-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Customer mock uses Prism (JSON only)
  customer-mock-internal:
    image: stoplight/prism:latest
    container_name: vpd-customer-mock-internal
    command: mock -h 0.0.0.0 /specs/customer-api.yaml
    volumes:
      - ./specs/vaping-duty/mocks:/specs
    environment:
      - PRISM_LOG_LEVEL=info
    networks:
      - domain-api-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4010/customers/CUST789', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Tax Platform mock uses Prism (JSON only)
  tax-platform-mock-internal:
    image: stoplight/prism:latest
    container_name: vpd-tax-platform-mock-internal
    command: mock -h 0.0.0.0 /specs/tax-platform-api.yaml
    volumes:
      - ./specs/vaping-duty/mocks:/specs
    environment:
      - PRISM_LOG_LEVEL=info
    networks:
      - domain-api-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4010/submissions/vpd/ACK-2026-01-26-000123', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================================
  # Logging Proxies (Envoy) - External access with tracing
  # =============================================================================

  excise-proxy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: vpd-excise-proxy
    ports:
      - "4010:4010"
      - "9901:9901"
    volumes:
      - ./config/envoy/envoy-excise.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      excise-mock-internal:
        condition: service_healthy
      lgtm:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=excise-proxy,job=envoy"
    networks:
      - domain-api-network

  customer-proxy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: vpd-customer-proxy
    ports:
      - "4011:4010"
      - "9902:9901"
    volumes:
      - ./config/envoy/envoy-customer.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      customer-mock-internal:
        condition: service_healthy
      lgtm:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=customer-proxy,job=envoy"
    networks:
      - domain-api-network

  tax-platform-proxy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: vpd-tax-platform-proxy
    ports:
      - "4012:4010"
      - "9903:9901"
    volumes:
      - ./config/envoy/envoy-tax-platform.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      tax-platform-mock-internal:
        condition: service_healthy
      lgtm:
        condition: service_started
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
        loki-external-labels: "service=tax-platform-proxy,job=envoy"
    networks:
      - domain-api-network

  # =============================================================================
  # Observability Stack (LGTM)
  # =============================================================================

  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: vpd-lgtm
    ports:
      - "3000:3000"   # Grafana UI
      - "3100:3100"   # Loki API (for Docker logging driver + Alloy)
      - "4317:4317"   # OTLP gRPC (from otel-collector only)
      - "4318:4318"   # OTLP HTTP
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    networks:
      - domain-api-network

  # =============================================================================
  # OTel Collector - fan-out for traces/metrics
  #
  # All services send OTLP to this collector (port 4319/4320) rather than
  # directly to LGTM. The collector forwards to local LGTM always.
  #
  # To also forward to k8s LGTM (lgtm.lab.local.ctoaas.co), swap the config:
  #   OTEL_CONFIG=config/otel-collector-fanout.yaml docker compose up -d otel-collector
  #
  # The fanout config drops k8s failures silently so offline mode still works.
  # =============================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    container_name: vpd-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      # Swap to config/otel-collector-fanout.yaml to also forward to k8s LGTM
      - ./config/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4319:4317"   # OTLP gRPC (services send here, not to lgtm:4317 directly)
      - "4320:4318"   # OTLP HTTP
    depends_on:
      - lgtm
    networks:
      - domain-api-network

  # =============================================================================
  # Testing
  # =============================================================================

  k6:
    image: grafana/k6:latest
    container_name: vpd-k6
    volumes:
      - ./tests/load:/tests
    environment:
      - DOMAIN_API_URL=http://domain-api-proxy:8080
      - EXCISE_URL=http://excise-proxy:4010
      - CUSTOMER_URL=http://customer-proxy:4010
      - TAX_PLATFORM_URL=http://tax-platform-proxy:4010
    networks:
      - domain-api-network
    profiles:
      - test
    depends_on:
      - domain-api-proxy
      - excise-proxy
      - customer-proxy
      - tax-platform-proxy

networks:
  domain-api-network:
    driver: bridge
