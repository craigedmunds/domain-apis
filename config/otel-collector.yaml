# OpenTelemetry Collector - Local only
#
# Receives OTLP from all compose services, forwards to local LGTM.
# Use otel-collector-fanout.yaml to also forward to k8s LGTM.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/local:
    endpoint: lgtm:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/local]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/local]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/local]
