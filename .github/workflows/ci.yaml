name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Spectral linting
        run: npm run lint

  validate:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specifications
        run: npm run validate

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --ci --runInBand --testTimeout=60000 --forceExit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --ci --runInBand --testTimeout=120000 --forceExit

  unit-tests-java:
    name: Java Unit Tests
    runs-on: arc-runner-domain-apis
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: mvn test -pl specs/vaping-duty/domain/platform-java

  build-java:
    name: Build Camel Java DSL Image
    runs-on: arc-runner-domain-apis
    steps:
      - uses: actions/checkout@v4

      - name: Wait for dind
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker ready" && break
            echo "Waiting for Docker... ($i/15)"
            sleep 2
          done

      - name: Build Java domain API image (native arch for testing)
        run: |
          docker build \
            -t vpd-domain-api-java:ci \
            specs/vaping-duty/domain/platform-java/

      - name: Smoke test - container starts and serves health
        run: |
          docker run -d --name vpd-java-smoke -p 8082:8082 vpd-domain-api-java:ci
          for i in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/health || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              docker rm -f vpd-java-smoke
              exit 0
            fi
            echo "Waiting for service... ($i/20) status=$status"
            sleep 3
          done
          echo "Service failed to start:"
          docker logs vpd-java-smoke
          docker rm -f vpd-java-smoke
          exit 1

  publish-java:
    name: Publish Multi-Arch Java Image
    runs-on: arc-runner-domain-apis
    needs: [build-java, unit-tests-java]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Wait for dind
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker ready" && break
            echo "Waiting for Docker... ($i/15)"
            sleep 2
          done

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: task domain:docker:build

  groovy-tests:
    name: Groovy Transformer Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transformer:
          - body-utils
          - store-request-builder
          - validation-error-builder
          - submission-return-response-builder
          - sparse-fieldsets
    steps:
      - uses: actions/checkout@v4

      - name: Test ${{ matrix.transformer }}
        run: |
          cd specs/vaping-duty/domain/platform/lib/transformers/${{ matrix.transformer }}
          if [ -d "test" ]; then
            docker run --rm \
              -v $(pwd):/build \
              -v $(pwd)/../common:/common:ro \
              -w /build \
              gradle:8.11-jdk21 gradle test --no-daemon
          else
            echo "No tests found for ${{ matrix.transformer }}"
          fi

