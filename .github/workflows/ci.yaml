name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Spectral linting
        run: npm run lint

  validate:
    name: Validate OpenAPI Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI specifications
        run: npm run validate

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --ci --runInBand --testTimeout=60000 --forceExit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration -- --ci --runInBand --testTimeout=120000 --forceExit

  build-java:
    name: Build Camel Java DSL Image
    runs-on: arc-runner-domain-apis
    steps:
      - uses: actions/checkout@v4

      - name: Build Java domain API image
        run: |
          docker build \
            -t vpd-domain-api-java:ci \
            specs/vaping-duty/domain/platform-java/

  groovy-tests:
    name: Groovy Transformer Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        transformer:
          - body-utils
          - store-request-builder
          - validation-error-builder
          - submission-return-response-builder
          - sparse-fieldsets
    steps:
      - uses: actions/checkout@v4

      - name: Test ${{ matrix.transformer }}
        run: |
          cd specs/vaping-duty/domain/platform/lib/transformers/${{ matrix.transformer }}
          if [ -d "test" ]; then
            docker run --rm \
              -v $(pwd):/build \
              -v $(pwd)/../common:/common:ro \
              -w /build \
              gradle:8.11-jdk21 gradle test --no-daemon
          else
            echo "No tests found for ${{ matrix.transformer }}"
          fi

