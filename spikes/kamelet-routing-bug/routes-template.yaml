# Using routeTemplate instead of Kamelet for inline reuse
# Route templates are designed for this use case

- routeTemplate:
    id: customerLookupTemplate
    parameters:
      - name: customerId
        description: The customer identifier
    from:
      uri: direct:{{routeTemplateId}}
      steps:
        - log:
            message: "Template: Looking up customer {{customerId}}"
            loggingLevel: INFO
        - removeHeaders:
            pattern: "CamelHttp*"
        - setHeader:
            name: CamelHttpMethod
            constant: "GET"
        - setHeader:
            name: Accept
            constant: "application/json"
        - toD:
            uri: "http://customer-proxy:4010/customers/{{customerId}}?bridgeEndpoint=true&throwExceptionOnFailure=false"
        - setProperty:
            name: customerResponse
            simple: "${body}"
        - log:
            message: "Template: Customer response received"
            loggingLevel: INFO

- restConfiguration:
    component: platform-http
    bindingMode: json

- rest:
    path: /test
    get:
      - path: /template-a/{customerId}
        to: direct:templateRouteA
      - path: /template-b/{customerId}
        to: direct:templateRouteB

- route:
    id: templateRouteA
    from:
      uri: direct:templateRouteA
      steps:
        - log:
            message: "Template Route A: Starting for customer ${header.customerId}"
            loggingLevel: INFO
        - setProperty:
            name: routeMarker
            constant: "TEMPLATE_ROUTE_A"
        # Use templatedRoute to call the reusable template
        - templatedRoute:
            routeTemplateRef: customerLookupTemplate
            parameters:
              customerId: "${header.customerId}"
        - log:
            message: "Template Route A: After template, routeMarker=${exchangeProperty.routeMarker}"
            loggingLevel: INFO
        - setBody:
            groovy: |
              import groovy.json.JsonSlurper
              import groovy.json.JsonOutput
              def customerJson = exchange.getProperty('customerResponse') ?: '{}'
              def customer = new JsonSlurper().parseText(customerJson.toString())
              return JsonOutput.toJson([
                route: 'A',
                routeMarker: exchange.getProperty('routeMarker'),
                customer: customer
              ])
        - setHeader:
            name: Content-Type
            constant: application/json

- route:
    id: templateRouteB
    from:
      uri: direct:templateRouteB
      steps:
        - log:
            message: "Template Route B: Starting for customer ${header.customerId}"
            loggingLevel: INFO
        - setProperty:
            name: routeMarker
            constant: "TEMPLATE_ROUTE_B"
        - templatedRoute:
            routeTemplateRef: customerLookupTemplate
            parameters:
              customerId: "${header.customerId}"
        - log:
            message: "Template Route B: After template, routeMarker=${exchangeProperty.routeMarker}"
            loggingLevel: INFO
        - setBody:
            groovy: |
              import groovy.json.JsonSlurper
              import groovy.json.JsonOutput
              def customerJson = exchange.getProperty('customerResponse') ?: '{}'
              def customer = new JsonSlurper().parseText(customerJson.toString())
              return JsonOutput.toJson([
                route: 'B',
                routeMarker: exchange.getProperty('routeMarker'),
                customer: customer
              ])
        - setHeader:
            name: Content-Type
            constant: application/json
