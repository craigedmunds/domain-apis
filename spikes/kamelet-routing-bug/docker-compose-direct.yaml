services:
  direct-subroutine-test:
    image: apache/camel-jbang:4.16.0
    container_name: direct-subroutine-test
    command: >
      run /routes/routes-direct.yaml
          --dep=org.apache.camel:camel-groovy
          --dep=org.apache.groovy:groovy-json:4.0.29
    ports:
      - "8092:8080"
    volumes:
      - .:/routes:ro
    networks:
      - domain-api-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/test/direct-a/CUST001"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

networks:
  domain-api-network:
    external: true
    name: domain-apis_domain-api-network
